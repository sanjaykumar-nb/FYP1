name: CI

# Every push and pull request runs the three test suites and the frontend type check,
# so a change that breaks one of them is visible before it reaches the demo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ai-service
      # No GROQ_API_KEY here on purpose: the graph analysis must work without an LLM.
      # "deferred" marks tests for features with no data source in the product yet
      # (meeting and communication intelligence); they stay in the tree, red, until built.
      - run: python -m pytest -q -m "not deferred"
        working-directory: ai-service

  frontend:
    name: Frontend type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run test:ci
        working-directory: frontend
