[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    mvp: MVP feature surface - must be green
    deferred: post-MVP feature - expected to fail until its phase lands
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
